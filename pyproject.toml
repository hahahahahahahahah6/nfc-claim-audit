[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nfc-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented tag capability"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
nfc-claim-audit = "nfc_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["nfc_claim_audit*"]
